<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GTA V — Маршрут мероприятия</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070b;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .panel {
      position: absolute;
      z-index: 1000;
      top: 15px;
      left: 15px;
      background: rgba(8, 12, 20, 0.92);
      color: white;
      padding: 14px 18px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.45);
      backdrop-filter: blur(8px);
    }

    .panel h1 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .panel p {
      margin: 4px 0;
      font-size: 13px;
      color: #c7ced9;
    }

    .legend {
      margin-top: 10px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }

    .start {
      background: #00d26a;
    }

    .finish {
      background: #2196ff;
    }

    .route {
      background: #ff3030;
    }

    .leaflet-control-attribution {
      font-size: 9px;
    }
  </style>
</head>

<body>

<div class="panel">
  <h1>🏁 GTA V — Маршрут мероприятия</h1>
  <p>🔍 Колесо мыши — приблизить</p>
  <p>🖐️ Зажми карту — переместить</p>

  <div class="legend">
    <span><span class="dot start"></span>START</span>
    <span><span class="dot route"></span>Маршрут</span>
    <span><span class="dot finish"></span>FINISH</span>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  /*
   * GTA V map.
   * The public tile set is 8192 x 8192 pixels.
   */

  const CRS = L.extend({}, L.CRS.Simple, {
    transformation: new L.Transformation(
      1 / 32,
      0,
      1 / 32,
      0
    )
  });

  const map = L.map("map", {
    crs: CRS,
    minZoom: 0,
    maxZoom: 5,
    zoomControl: true,
    attributionControl: true
  });

  const satellite = L.tileLayer(
    "https://viruxe.github.io/gtav-map-tiles/satelite/{z}/{x}-{y}.webp",
    {
      minZoom: 0,
      maxZoom: 5,
      noWrap: true,
      bounds: [
        [0, 0],
        [8192, 8192]
      ],
      attribution: "GTA V map tiles"
    }
  );

  const atlas = L.tileLayer(
    "https://viruxe.github.io/gtav-map-tiles/atlas/{z}/{x}-{y}.webp",
    {
      minZoom: 0,
      maxZoom: 5,
      noWrap: true,
      bounds: [
        [0, 0],
        [8192, 8192]
      ],
      attribution: "GTA V map tiles"
    }
  );

  satellite.addTo(map);

  L.control.layers(
    {
      "Satellite": satellite,
      "Atlas": atlas
    },
    null,
    {
      position: "topright"
    }
  ).addTo(map);


  /*
   * ROUTE
   *
   * Пока ставим маршрут приблизительно.
   * После проверки карты его можно будет подправить.
   */

  const route = [
    [4090, 4090],
    [4100, 4140],
    [4120, 4180],
    [4170, 4180],
    [4230, 4185],
    [4300, 4190],
    [4380, 4200],
    [4450, 4210]
  ];

  const routeLine = L.polyline(
    route,
    {
      color: "#ff3030",
      weight: 8,
      opacity: 0.95,
      lineCap: "round",
      lineJoin: "round"
    }
  ).addTo(map);


  /*
   * START
   */

  const startIcon = L.divIcon({
    className: "",
    html: `
      <div style="
        width:34px;
        height:34px;
        border-radius:50%;
        background:#00d26a;
        border:4px solid white;
        box-shadow:0 3px 12px rgba(0,0,0,.6);
        display:flex;
        align-items:center;
        justify-content:center;
        color:white;
        font-weight:bold;
        font-size:12px;
      ">S</div>
    `,
    iconSize: [34, 34],
    iconAnchor: [17, 17]
  });


  /*
   * FINISH
   */

  const finishIcon = L.divIcon({
    className: "",
    html: `
      <div style="
        width:38px;
        height:38px;
        border-radius:50%;
        background:#2196ff;
        border:4px solid white;
        box-shadow:0 3px 12px rgba(0,0,0,.6);
        display:flex;
        align-items:center;
        justify-content:center;
        color:white;
        font-weight:bold;
        font-size:16px;
      ">🏁</div>
    `,
    iconSize: [38, 38],
    iconAnchor: [19, 19]
  });


  L.marker(route[0], {
    icon: startIcon
  })
  .addTo(map)
  .bindPopup("<b>START</b><br>Старт мероприятия");


  L.marker(route[route.length - 1], {
    icon: finishIcon
  })
  .addTo(map)
  .bindPopup("<b>FINISH</b><br>Финиш маршрута");


  /*
   * CHECKPOINTS
   */

  const checkpoints = [
    {
      name: "CHECKPOINT 1",
      position: route[2]
    },
    {
      name: "CHECKPOINT 2",
      position: route[4]
    },
    {
      name: "CHECKPOINT 3",
      position: route[6]
    }
  ];

  checkpoints.forEach((point) => {

    const icon = L.divIcon({
      className: "",
      html: `
        <div style="
          width:24px;
          height:24px;
          border-radius:50%;
          background:#ffc107;
          border:3px solid white;
          box-shadow:0 2px 8px rgba(0,0,0,.6);
          display:flex;
          align-items:center;
          justify-content:center;
          color:#111;
          font-size:11px;
          font-weight:bold;
        ">✓</div>
      `,
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    L.marker(point.position, {
      icon: icon
    })
    .addTo(map)
    .bindPopup("<b>" + point.name + "</b>");
  });


  /*
   * Initial view
   */

  map.fitBounds(
    [
      [3000, 3000],
      [5200, 5200]
    ],
    {
      padding: [20, 20]
    }
  );

</script>

</body>
</html>
